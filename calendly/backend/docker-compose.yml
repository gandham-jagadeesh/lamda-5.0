services:
  postgres:
    image: postgres:16
    container_name: temporal-storage
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    networks:
      - temporal-network
    volumes:
        - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD","pg_isready","-U","temporal","-d","temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    container_name: temporal-admin-tools
    restart: "on-failure:6"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - SQL_PASSWORD=temporal
    networks:
      - temporal-network
    volumes:
     - ./src/config/temporal/scripts:/scripts:ro
    entrypoint:  ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]

  temporal-create-namespace:
    image: temporalio/admin-tools:latest
    container_name: temporal-create-namespace
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    networks:
      - temporal-network
    volumes:
      - ./src/config/temporal/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]

  temporal:
    image: temporalio/server:latest
    container_name: temporal
    depends_on:
      temporal-admin-tools:
          condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - DBNAME=temporal
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yml
    ports:
       - "7233:7233"
    volumes:
      - ./src/config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal-network
    healthcheck:
     test: ["CMD", "nc", "-z", "localhost", "7233"]
     interval: 5s
     timeout: 3s
     start_period: 30s
     retries: 60


  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - temporal-network


networks:
  temporal-network:
    driver: bridge

volumes:
  temporal-postgres-data:
